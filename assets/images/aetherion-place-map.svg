<title id="map-title">One fictional square, several ways to read it</title><desc id="map-desc">Route A runs directly from an entrance to a stepped building entry. Route B follows the edge past a resting point. An information point and a change of level invite questions about access, waiting and wayfinding. This is an invented learning sketch, not a checked route.</desc>
