name: Aetherion Collaboration + Field Note QA (review only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'org/**'
      - 'journal/**'
      - 'events/**'
      - 'partners/**'
      - 'assets/aeth-collaboration.css'
      - 'qa/aeth-collaboration-qa.mjs'
      - '.github/workflows/aeth-collaboration-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    name: Focused actual-browser QA — no deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install chromium --with-deps
      - name: Serve exact pull request checkout
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 > /tmp/aeth-collab-http.log 2>&1 &
          for i in $(seq 1 15); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8766/org/work-with-us/; then exit 0; fi
            sleep 1
          done
          cat /tmp/aeth-collab-http.log
          exit 1
      - name: Test six routes across four widths
        run: node qa/aeth-collaboration-qa.mjs
      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeth-collaboration-qa-${{ github.sha }}
          path: |
            qa/artifacts/aeth-collab-*
            /tmp/aeth-collab-http.log
          if-no-files-found: warn
          retention-days: 14
