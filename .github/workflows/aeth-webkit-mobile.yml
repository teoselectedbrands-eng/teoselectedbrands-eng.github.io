name: Aetherion WebKit Mobile Review (no deploy)
on:
  push:
    branches: [review/aetherion-home-catalogues-ux-20261115]
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'movement/**'
      - 'classes/**'
      - 'workshops/**'
      - 'learn/**'
      - 'journal/**'
      - 'assets/aeth-*'
      - 'qa/aeth-webkit-mobile.mjs'
      - '.github/workflows/aeth-webkit-mobile.yml'
permissions:
  contents: read
jobs:
  webkit:
    name: WebKit touch/mobile experience — no deploy
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install webkit --with-deps
      - name: Serve exact branch locally
        run: |
          python3 -m http.server 8768 --bind 127.0.0.1 > /tmp/aeth-webkit-http.log 2>&1 &
          for i in $(seq 1 15); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8768/workshops/; then exit 0; fi
            sleep 1
          done
          cat /tmp/aeth-webkit-http.log
          exit 1
      - name: Test mobile rendering and navigation with Safari rendering engine
        run: node qa/aeth-webkit-mobile.mjs
      - name: Keep WebKit screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeth-webkit-mobile-${{ github.sha }}
          path: |
            qa/artifacts/aeth-webkit-*
            /tmp/aeth-webkit-http.log
          retention-days: 14
          if-no-files-found: warn
