name: Aetherion Seven-Lab Mobile Chromium QA (review only)

on:
  pull_request:
    paths:
      - 'learn/field-labs/**'
      - 'learn/learn-001/field-lab/**'
      - 'learn/learn-002/field-lab/**'
      - 'assets/aeth-facilitator-studio.css'
      - 'qa/aetherion-seven-labs-browser.mjs'
      - '.github/workflows/aetherion-seven-labs-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-review:
    name: Mobile screenshots, interactions and automated WCAG subset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for read-only review
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0 axe-core@4.10.3
          npx playwright install chromium --with-deps
      - name: Serve exact branch files
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/aetherion-seven-labs.log 2>&1 &
          for n in $(seq 1 15); do
            curl --fail --silent --output /dev/null http://127.0.0.1:8765/learn/field-labs/ && exit 0
            sleep 1
          done
          cat /tmp/aetherion-seven-labs.log
          exit 1
      - name: Run Chromium checks
        run: node qa/aetherion-seven-labs-browser.mjs
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetherion-seven-labs-visual
          path: |
            qa/artifacts-facilitation/
            /tmp/aetherion-seven-labs.log
          if-no-files-found: warn
          retention-days: 14
