name: Aetherion Foundation QA (review branch)
on:
  push:
    branches:
      - main
      - review/aetherion-learn-practice-events-pro-scope-20261114
    paths: &aetherion_paths
      - 'learn/**'
      - 'classes/**'
      - 'events/**'
      - 'professional-services/**'
      - 'index.html'
      - 'assets/app.js'
      - 'assets/site.css'
      - 'assets/foundation.css'
      - 'assets/aeth-pathways.*'
      - 'assets/pathways/**'
      - 'qa/aetherion-foundation.mjs'
      - '.github/workflows/aetherion-foundation-qa.yml'
  pull_request:
    branches:
      - main
    paths: *aetherion_paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aetherion-foundation-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: Actual HTML and Chromium QA — no deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0 axe-core@4.10.3
          npx playwright install chromium --with-deps
      - name: Serve actual GitHub branch files locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/foundation-http.log 2>&1 &
          echo $! > /tmp/foundation-http.pid
          for attempt in $(seq 1 15); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/learn/; then exit 0; fi
            sleep 1
          done
          cat /tmp/foundation-http.log
          exit 1
      - name: Verify routes, labs and screenshots
        run: node qa/aetherion-foundation.mjs
      - name: Archive audit evidence even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-qa-${{ github.sha }}
          path: |
            qa/artifacts/
            /tmp/foundation-http.log
          if-no-files-found: warn
          retention-days: 14
