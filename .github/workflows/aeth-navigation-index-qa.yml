name: Aetherion Navigation + Content Index QA (review only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'movement/**'
      - 'classes/**'
      - 'workshops/**'
      - 'learn/**'
      - 'journal/**'
      - 'discover/**'
      - 'assets/aeth-*'
      - 'assets/app.js'
      - 'resources/movement-practice-notes/**'
      - 'sitemap.xml'
      - 'qa/aeth-ux-audit.mjs'
      - '.github/workflows/aeth-navigation-index-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    name: Indexed routes and real browser QA — no deploy
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install chromium --with-deps
      - name: Start local review server
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 > /tmp/aeth-ux-http.log 2>&1 &
          for i in $(seq 1 15); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8767/workshops/; then exit 0; fi
            sleep 1
          done
          cat /tmp/aeth-ux-http.log
          exit 1
      - name: Review 112 new routes and actual browser navigation
        run: node qa/aeth-ux-audit.mjs
      - name: Archive screenshots and QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeth-navigation-index-qa-${{ github.sha }}
          path: |
            qa/artifacts/aeth-ux-*
            /tmp/aeth-ux-http.log
          if-no-files-found: warn
          retention-days: 14
