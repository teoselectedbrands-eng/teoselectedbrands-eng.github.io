name: Aetherion Practice + Inquiry + Original Brand QA (review only)
on:
  push:
    branches: [review/aetherion-practice-field-access-20261115]
  pull_request:
    branches: [main]
    paths:
      - 'movement/**'
      - 'classes/**'
      - 'inquiry/**'
      - 'membership/**'
      - 'assets/aeth-practice*'
      - 'assets/aeth-inquiry*'
      - 'assets/brand/**'
      - 'assets/site.css'
      - 'qa/aeth-practice-release.mjs'
      - '.github/workflows/aeth-practice-release.yml'
permissions:
  contents: read
jobs:
  verify:
    name: Chromium and WebKit practice navigation — no deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browsers
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install chromium webkit --with-deps
      - name: Serve checkout locally
        run: |
          python3 -m http.server 8770 --bind 127.0.0.1 > /tmp/aeth-practice-http.log 2>&1 &
          for i in $(seq 1 15); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8770/classes/pilates/; then exit 0; fi
            sleep 1
          done
          cat /tmp/aeth-practice-http.log
          exit 1
      - name: Verify pages, brand assets and safe inquiry routes
        run: node qa/aeth-practice-release.mjs
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeth-practice-qa-${{ github.sha }}
          path: |
            qa/artifacts/aeth-practice-*
            /tmp/aeth-practice-http.log
          retention-days: 14
          if-no-files-found: warn
