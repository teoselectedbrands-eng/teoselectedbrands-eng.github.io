name: Aetherion Academy Guided Lab QA (review only)

on:
  pull_request:
    paths:
      - 'learn/learn-001/index.html'
      - 'learn/learn-002/index.html'
      - 'learn/learn-001/field-lab/index.html'
      - 'learn/learn-002/field-lab/index.html'
      - 'assets/aeth-field-labs.css'
      - 'docs/aetherion-academy-track-learning-register-20261114.md'
      - 'qa/aetherion-guided-labs.mjs'
      - '.github/workflows/aetherion-guided-labs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published claims, relationships and exercise accessibility
        run: node qa/aetherion-guided-labs.mjs
